# Planner LLM settings (Google Gemini API; also serves Gemma open models).
model: "gemma-4-31b-it"
temperature: 0.2
max_output_tokens: 2048
request_timeout_ms: 30000

# Output mode. Gemma models do NOT support response_json_schema (it returns
# 504 DEADLINE_EXCEEDED), so we use JSON mime mode and describe the shape in the
# prompt, then parse robustly. Gemini models support schema mode too, but JSON
# mime + parsing is portable across both.
json_mime: true

# Robust-parse / repair behavior.
max_parse_repairs: 1

# Replanning controls (anti-loop).
max_replans: 3
require_rationale: true
loop_detection: true        # validator rejects near-identical failed replans

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtp"
version = "0.1.0"
description = "Robot Task Planner with self-correcting execution: an LLM planner over scripted MuJoCo primitives with postcondition checks and replanning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tumelo Ngono" }]
dependencies = [
    "mujoco>=3.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "mink>=0.0.4",
    "google-genai>=0.3",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "h5py>=3.8",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
